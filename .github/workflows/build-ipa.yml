name: Build iOS IPA

on:
  push:
    branches: [ "main", "master" ]
    tags:
      - "v*"
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:
    inputs:
      upload_release:
        description: 'Tự động tạo Release kèm file IPA'
        required: false
        type: boolean
        default: false

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-ipa:
    name: Build & Package BlockOut.ipa
    runs-on: macos-latest
    timeout-minutes: 30

    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v4

      - name: 🔍 Check Xcode Environment
        run: |
          xcodebuild -version
          xcrun --show-sdk-path --sdk iphoneos

      - name: 🛠️ Setup XcodeGen
        run: |
          if ! command -v xcodegen &> /dev/null; then
            brew install xcodegen
          fi
          xcodegen --version

      - name: 📁 Generate Xcode Project
        run: |
          xcodegen generate

      - name: 🔨 Build iOS Application (.app)
        run: |
          set -o pipefail
          xcodebuild clean build \
            -project BlockOut.xcodeproj \
            -scheme BlockOut \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath "${PWD}/DerivedData" \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGN_STYLE="Manual" \
            AD_HOC_CODE_SIGNING_ALLOWED=YES 2>&1 | tee xcodebuild.log || (echo "❌ BUILD FAILED! Compiler errors:" && grep -C 3 -i "error:" xcodebuild.log && exit 1)

      - name: 📋 Upload Build Log (if failed)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: xcodebuild-failure-log
          path: xcodebuild.log
          retention-days: 7

      - name: 📦 Package into .ipa
        run: |
          APP_PATH=$(find "${PWD}/DerivedData/Build/Products" -name "BlockOut.app" -type d | head -n 1)
          if [ -z "${APP_PATH}" ]; then
            echo "❌ Error: BlockOut.app not found in DerivedData"
            exit 1
          fi
          echo "✅ Found app at: ${APP_PATH}"
          mkdir -p Payload
          cp -R "${APP_PATH}" Payload/
          zip -r -9 "${GITHUB_WORKSPACE}/BlockOut.ipa" Payload
          cd "${GITHUB_WORKSPACE}"
          shasum -a 256 BlockOut.ipa > BlockOut.ipa.sha256
          ls -lh BlockOut.ipa

      - name: 🚀 Upload IPA Artifact (Tải trực tiếp từ GitHub Actions)
        uses: actions/upload-artifact@v4
        with:
          name: BlockOut-iOS-v1.0.0-IPA
          path: |
            BlockOut.ipa
            BlockOut.ipa.sha256
          retention-days: 30

      - name: 🏷️ Release to GitHub Releases
        if: startsWith(github.ref, 'refs/tags/') || github.event.inputs.upload_release == 'true'
        uses: softprops/action-gh-release@v2
        with:
          files: |
            BlockOut.ipa
            BlockOut.ipa.sha256
          name: Release ${{ github.ref_name }}
          body: |
            🎉 **Block Out! - Color Sort Puzzle (iOS Native)**
            
            - Phiên bản: `1.0.0`
            - Nền tảng: iOS 16.0+
            - Định dạng: `.ipa` (Sideload sẵn sàng cho AltStore, Sideloadly, TrollStore, Scarlet, Esign)
            - Checksum SHA-256: xem file đính kèm `BlockOut.ipa.sha256`
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
