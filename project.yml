name: BlockOut
options:
  bundleIdPrefix: com.blockout.puzzle
  deploymentTarget:
    iOS: "16.0"

settings:
  base:
    SWIFT_VERSION: "5.9"
    IPHONEOS_DEPLOYMENT_TARGET: "16.0"
    TARGETED_DEVICE_FAMILY: "1,2"
    CODE_SIGN_STYLE: Manual
    CODE_SIGN_IDENTITY: ""
    CODE_SIGNING_REQUIRED: NO
    CODE_SIGNING_ALLOWED: NO
    DEVELOPMENT_TEAM: ""
    PROVISIONING_PROFILE_SPECIFIER: ""
    AD_HOC_CODE_SIGNING_ALLOWED: YES
    ENABLE_BITCODE: NO

targets:
  BlockOut:
    type: application
    platform: iOS
    deploymentTarget: "16.0"
    sources:
      - path: Sources/BlockOutGame
    info:
      path: Info.plist
    settings:
      base:
        PRODUCT_NAME: BlockOut
        PRODUCT_BUNDLE_IDENTIFIER: com.blockout.puzzle.ios
        MARKETING_VERSION: "1.0.0"
        CURRENT_PROJECT_VERSION: "1"
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: Info.plist
        CODE_SIGN_STYLE: Manual
        CODE_SIGN_IDENTITY: ""
        CODE_SIGNING_REQUIRED: NO
        CODE_SIGNING_ALLOWED: NO
        DEVELOPMENT_TEAM: ""
        PROVISIONING_PROFILE_SPECIFIER: ""

schemes:
  BlockOut:
    build:
      targets:
        BlockOut: all
    run:
      config: Release
